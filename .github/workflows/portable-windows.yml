name: Build portable Windows ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - deployment/portable-windows
      - 'release/windows-final-*'
      - release/windows-original-packaging

permissions:
  contents: read

jobs:
  build-windows-zip:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"

      - name: Set up Node.js for build
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for build
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: Build portable release
        shell: powershell
        run: ./packaging/windows/build-release.ps1

      - name: Test results components
        shell: powershell
        working-directory: frontend
        run: |
          node --test tests/results-ui.test.cjs tests/proxy-timeout.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Results component tests failed" }

      - name: Smoke-test bundled application
        shell: powershell
        run: ./packaging/windows/smoke-launcher.ps1

      - name: Save Windows test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: ${{ runner.temp }}/AIP-launcher-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AIP-Week2-Allocator-Windows-Original-Packaging
          path: |
            release/AIP-Week2-Allocator-Windows.zip
            release/SHA256SUMS.txt
            release/release-manifest.json
          if-no-files-found: error
          retention-days: 14
